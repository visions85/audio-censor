# Default profanity list, grouped by tier.
#
# Pattern syntax (case-insensitive, matched against whole words):
#   word        exact whole-word match          ("hell" does not match "hello")
#   word*       prefix match                    ("fuck*" matches fucking, fucker, fucked)
#   two words   phrase, each token as above     ("god damn", "son of a bitch*")
#   re:regex    regular expression on one normalized token
#
# A user config can add to any tier under [words.tiers], add patterns with
# words.extra, and exempt matches with words.allow.

[tiers]
strong = [
  "fuck*", "motherfuck*", "mother fuck*", "fuk", "fuks", "fuked", "fuking", "fukin", "fck*", "effing",
